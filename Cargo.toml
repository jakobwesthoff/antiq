[package]
name = "antiq"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
rust-version = "1.97"
description = "Your idle folders, kept like antiques"
repository = "https://github.com/jakobwesthoff/antiq"
readme = "README.md"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
glob = "0.3.4"
ignore = "0.4.34"
jiff = { version = "0.2.39", features = ["serde"] }
libc = "0.2.191"
miette = { version = "7.6.0", default-features = false, features = ["derive"] }
nucleo = "0.5.0"
regex = "1.13.1"
rustix = { version = "1.1.6", features = ["fs", "process", "system", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
strsim = "0.11.1"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
toml = "1.1.8"
toml_edit = "0.25.17"
ulid = "3.0.0"
unicode-normalization = "0.1.26"
unicode-width = "0.2.3"
whoami = "2.1.3"
# `experimental` exposes `ZSTD_getFrameProgression`, which reports the bytes the
# compressor has consumed. The call is an experimental libzstd API, and the
# `zstd-sys` crate bundles its own libzstd, so the version in Cargo.lock pins it.
zstd = { version = "0.14.3", default-features = false, features = ["experimental", "zstdmt"] }

[dev-dependencies]
filetime = "0.2.29"
insta = { version = "1.49.0", features = ["filters"] }
tempfile = "3.27.0"
