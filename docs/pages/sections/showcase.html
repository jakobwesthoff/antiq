<section id="showcase" class="showcase">
  <div class="container">
    <h2>See it work</h2>
    <p class="showcase-lead">These are real runs of antiq on a terminal, with the colours antiq writes.</p>

    <figure class="shot">
      <img src="assets/shots/archive-live.gif" alt="antiq archiving three folders: a card with a progress bar for each, finished lines above them" width="1900" height="640">
      <figcaption>Each piece that is working has a card with a progress bar. A line stays behind for each piece that finished.</figcaption>
    </figure>

    <div class="shot-grid">
      <figure class="shot">
        <img src="assets/shots/status.png" alt="antiq status: a table of the pieces that are due, soon due or pinned" loading="lazy">
        <figcaption><code>antiq status</code> lists what is idle, what is due soon and what is pinned.</figcaption>
      </figure>
      <figure class="shot">
        <img src="assets/shots/push.png" alt="antiq push --init claims the target and prints one line for each piece" loading="lazy">
        <figcaption><code>antiq push</code> mirrors the collection to one target.</figcaption>
      </figure>
      <figure class="shot">
        <img src="assets/shots/error-damaged.png" alt="an antiq error block: the push is refused because versions are damaged, with the command that repairs them" loading="lazy">
        <figcaption>An error says what went wrong, how to fix it and what antiq was doing.</figcaption>
      </figure>
    </div>
  </div>
</section>
