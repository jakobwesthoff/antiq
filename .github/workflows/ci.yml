# Runs the check every commit has to pass (formatting, clippy, the tests)
# on macOS and Linux for every push to main and every pull request.

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain has no versioned releases. Its only tag, v1, marks
      # a commit on master, so updating this pin may need a manual bump.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: just
      # The push tests run the real rsync, 3.2.4 or newer. macOS ships
      # openrsync, which antiq refuses, so the runner gets Homebrew's.
      - if: runner.os == 'macOS'
        run: brew install rsync
      # A packing test sets a user extended attribute, which Linux does
      # with setfattr from the attr package, and the hand checks unpack
      # with `tar --zstd`, which runs the zstd executable.
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y attr zstd
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: just check
